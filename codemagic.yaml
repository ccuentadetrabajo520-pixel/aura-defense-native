workflows:
  aura-android-release:
    name: Aura Defense Android Release
    max_build_duration: 60
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.aura.defense"
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Make Gradle executable
        script: |
          chmod +x ./gradlew
      - name: Clean project
        script: |
          ./gradlew clean
      - name: Build release APK
        script: |
          ./gradlew assembleRelease --stacktrace
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - yojamm16@gmail.com
        notify:
          success: true
          failure: true
